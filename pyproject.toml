[project]
name = "pynoptic"
version = "0.1.0"
description = "A profiler that combines static and dynamic metrics to build a multidimensional view of Python code."
readme = "README.md"
authors = [
    { name = "DiegoMunevar2007", email = "d.munevar@uniandes.edu.co" },
    { name = "eerosales24", email = "ee.rosales24@uniandes.edu.co"}
]
requires-python = ">=3.11"

dependencies = [
    "dynapyt>=4.1.0",
    "semgrep>=1.177.0",
]

[project.scripts]
pynoptic = "pynoptic.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pyyaml>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["uv-build>=0.11.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/pynoptic/restrictions.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pynoptic"]

[[tool.mypy.overrides]]
module = ["dynapyt.*", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pynoptic.dynamic.analysis"]
disallow_subclassing_any = false
